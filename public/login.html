<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — DocuWare Control Center</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(1200px 600px at 15% -10%,#1e3a8a 0%,transparent 60%),radial-gradient(1000px 600px at 110% 10%,#5b21b6 0%,transparent 55%),#0b1120;display:flex;align-items:center;justify-content:center;padding:24px;color:#0f172a;overflow:hidden}
#cube-background{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.card-head{padding:28px 32px 22px;text-align:center;background:linear-gradient(135deg,#172554,#2563eb);color:#fff}
.logo-wrap{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;padding:8px;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.logo-wrap img{width:100%;height:100%;object-fit:contain}
.card-head h1{margin:0;font-size:19px;font-weight:800}
.card-head p{margin:6px 0 0;font-size:13px;color:#dbeafe}
.owner{padding:16px 32px;text-align:center;border-bottom:1px solid #eef1f6}
.owner b{display:block;font-size:15px;color:#0f172a}
.owner span{display:block;font-size:12px;color:#64748b;margin-top:2px}
.owner a{display:inline-block;margin-top:4px;font-size:12px;color:#2563eb;text-decoration:none}
.owner a:hover{text-decoration:underline}
form{padding:26px 32px 30px}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:16px}
input{width:100%;margin-top:7px;border:1px solid #d6dde7;border-radius:9px;padding:12px 13px;font:inherit;background:#f8fafc}
input:focus{outline:2px solid #93c5fd;background:#fff}
.btn{width:100%;border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:800;font-size:14px;background:#2563eb;color:#fff;transition:.15s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.6;cursor:default}
.error{margin:0 0 16px;padding:11px 13px;border-radius:9px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px;display:none}
.error.show{display:block}
footer{text-align:center;padding:0 32px 26px;font-size:11px;color:#94a3b8}
</style>
</head>
<body>
<canvas id="cube-background" aria-hidden="true"></canvas>
<div class="card">
  <div class="card-head">
    <div class="logo-wrap"><img src="https://start.docuware.com/hs-fs/hubfs/__%20Corporate%20Website/Logos/DocuWare---Logo---Color---RGB---402px.png?width=200&amp;height=90&amp;name=DocuWare---Logo---Color---RGB---402px.png" alt="DocuWare" onerror="this.parentElement.textContent='DW'"></div>
    <h1>DocuWare Control Center</h1>
    <p>Sign in to continue</p>
  </div>
  <div class="owner">
    <b>Naveed Niazi</b>
    <span>Enterprise AI Consultant &amp; Solution Architect</span>
    <a href="mailto:nniazi350@gmail.com">nniazi350@gmail.com</a>
  </div>
  <form id="loginForm">
    <div class="error" id="loginError"></div>
    <label>Username<input type="text" id="username" autocomplete="username" autofocus required></label>
    <label>Password<input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </form>
  <footer>&copy; <span id="year"></span> Naveed Niazi — DocuWare Control Center</footer>
</div>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
if (window.THREE && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const canvas = document.getElementById("cube-background");
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (error) {
    console.warn("The animated login background is unavailable.", error);
  }
  if (renderer) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial());
    scene.add(cube);
    camera.position.z = 5;
    const updateCubeLayout = () => {
      const halfViewWidth = camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
      cube.position.x = Math.min(3.5, halfViewWidth * 0.68);
      const size = Math.max(1.3, Math.min(2.7, camera.aspect * 2.1));
      cube.scale.setScalar(size);
    };
    updateCubeLayout();
    const resize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCubeLayout();
    };
    window.addEventListener("resize", resize);
    const animate = () => {
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    };
    animate();
  }
}
const params = new URLSearchParams(location.search);
const redirectTo = params.get("redirect") || "/";

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("loginError");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || "Sign in failed.");
    location.href = redirectTo;
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
